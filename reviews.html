<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090817">
<title>Отзывы — Nexora</title>
<style>

:root{--bg:#090817;--panel:#141127;--text:#f7f4ff;--muted:#aaa4c3;--purple:#9b6cff;--pink:#e16bff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 5%,#38205f 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,90%);margin:auto}
header{position:sticky;top:0;z-index:10;background:#090817dd;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.logo span{color:#b58cff}.links{display:flex;gap:30px;color:#d5cfea;font-size:14px}.links a:hover{color:#c39bff}.menu{display:none;background:#17132b;border:1px solid #ffffff2b;border-radius:15px;width:48px;height:48px;color:white;font-size:23px}
.hero{padding:105px 0 90px;text-align:center}.tag{display:inline-block;border:1px solid #a879ff66;background:#9b6cff18;color:#c9adff;border-radius:30px;padding:7px 15px;font-size:13px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:1.06;letter-spacing:-3px;margin:25px auto 20px;max-width:850px}.gradient{background:linear-gradient(100deg,#a88aff,#e17cff,#7da9ff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:18px;max-width:620px;margin:0 auto 30px}.btn{display:inline-block;padding:13px 22px;border-radius:12px;background:linear-gradient(110deg,#8759ef,#c15ee9);font-weight:700;box-shadow:0 8px 30px #9b6cff33}.btn.secondary{background:#ffffff0c;border:1px solid #ffffff25;margin-left:10px;box-shadow:none}
section{padding:75px 0}.section-title{text-align:center;font-size:36px;letter-spacing:-1px;margin:0 0 12px}.sub{text-align:center;color:var(--muted);margin:0 auto 38px;max-width:600px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,#19152e,#100e20);border:1px solid #ffffff14;border-radius:20px;padding:25px}.ico{font-size:27px}.card h3{margin:12px 0 8px}.card p{color:var(--muted);font-size:14px;margin:0}.project-label{display:inline-block;color:#c6a8ff;background:#9b6cff1c;padding:4px 9px;border-radius:20px;font-size:11px;margin-top:16px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.step{padding:20px;border-left:2px solid #9b6cff;background:#ffffff08;border-radius:0 14px 14px 0}.step b{color:#bd9aff}.about{max-width:760px;margin:auto;text-align:center;color:var(--muted)}.reviews{max-width:700px;margin:auto;text-align:center}.reviews .card{color:var(--muted)}.contact{text-align:center;background:linear-gradient(120deg,#251746,#17112e);border:1px solid #ffffff16;border-radius:25px;padding:45px 20px}.contact p{color:var(--muted)}footer{padding:30px 0;color:#827b9b;border-top:1px solid #ffffff12;font-size:13px}
@media(max-width:700px){.links{display:none;position:absolute;top:76px;left:0;right:0;background:#100d20;padding:18px 5%;flex-direction:column;gap:16px;border-bottom:1px solid #ffffff20}.links.open{display:flex}.menu{display:block}.hero{padding:75px 0 60px}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.btn.secondary{margin:12px 0 0}.section-title{font-size:30px}}

.links a.active{color:#c39bff}
.page-hero{padding:75px 0 25px;text-align:center}
.page-hero h1{font-size:clamp(38px,6vw,60px);margin:15px 0}
.page-content{padding:25px 0 85px}
.back-link{display:inline-block;color:#c9adff;margin-top:25px}

</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">Nex<span>ora</span></a><nav class="links" id="navlinks"><a href="support.html" class="">Поддержка</a><a href="portfolio.html" class="">Портфолио</a><a href="reviews.html" class="active">Отзывы</a></nav><button class="menu" id="menu" aria-label="Открыть меню">☰</button></div></header>
<main><section class="page-hero"><div class="wrap"><span class="tag">ОБРАТНАЯ СВЯЗЬ</span><h1>Отзывы</h1><p class="sub">Нам важно мнение каждого клиента.</p></div></section>
<section class="page-content"><div class="wrap"><div class="card reviews"><div class="ico">♡</div><h3>Первые отзывы скоро появятся</h3><p>Мы не публикуем выдуманные отзывы. Здесь будут мнения реальных клиентов после завершённых проектов.</p></div><a class="back-link" href="index.html">← На главную</a></div></section></main>
<footer><div class="wrap">© 2026 Nexora. Telegram Automation Studio.</div></footer>

<script>
const menu=document.getElementById('menu'),links=document.getElementById('navlinks');
menu.addEventListener('click',()=>{links.classList.toggle('open');menu.textContent=links.classList.contains('open')?'×':'☰'});
links.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{links.classList.remove('open');menu.textContent='☰'}));
</script>

</body></html>
